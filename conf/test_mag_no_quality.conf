/*
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Nextflow config file for running minimal tests
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Defines input files and everything required to run a fast and simple pipeline test.

    Use as follows:
        nextflow run nf-core/seqsubmit -profile test,<docker/singularity> --outdir <OUTDIR>

----------------------------------------------------------------------------------------
*/

process {
    resourceLimits = [
        cpus: 2,
        memory: '16.GB',
        time: '1.h'
    ]
}

params {
    config_profile_name        = 'Test --mode mags no_quality profile'
    config_profile_description = 'Single-case MAG test with missing completeness and contamination values'

    // Input data
    // TODO nf-core: Specify the paths to your test data on nf-core/test-datasets
    // TODO nf-core: Give any required params for the test so that command line flags are not needed
    input            = "${projectDir}/assets/test_samplesheets/no_quality.csv"

    mode             = "mags"
    submission_study = "PRJEB98843"
    centre_name      = "TEST_CENTER"

    test_upload      = true

    cat_db           = null
    // CheckM2 doesn't allow usage of small test database, so real database will be downloaded during the test run,
    // which is not ideal but necessary to test the pipeline's behaviour with missing quality values
    checkm2_db       = null

}
