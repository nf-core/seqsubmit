/*
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Nextflow config file for running minimal tests
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Defines input files and everything required to run a fast and simple pipeline test.

    Use as follows:
        nextflow run nf-core/seqsubmit -profile test,<docker/singularity> --outdir <OUTDIR>

----------------------------------------------------------------------------------------
*/

process {
    resourceLimits = [
        cpus: 2,
        memory: '12.GB',
        time: '1.h'
    ]

    withName: 'REGISTERSTUDY|SUBMIT|CREATE_MANIFESTS' {
          ext.when = false
    }
}

params {
    config_profile_name        = 'Test --mode mags one_contig profile'
    config_profile_description = 'Single-case MAG test with one contig assembly. No submission performed, invalid_fastas.tsv file generated. Test skips all modules using ENA queries.'

    // Input data
    input            = params.pipelines_testdata_base_path + 'seqsubmit/samplesheets/mag_one_contig.csv'
    outdir           = 'test_output'

    mode             = "mags"
    submission_study = "TEST_STUDY"
    centre_name      = "TEST_CENTER"

    test_upload      = true

    cat_db           = null
    checkm2_db       = null
}
