/*
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Nextflow config file for running minimal tests
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    Defines input files and everything required to run a fast and simple pipeline test.

    Use as follows:
        nextflow run nf-core/seqsubmit -profile test,<docker/singularity> --outdir <OUTDIR>

----------------------------------------------------------------------------------------
*/

process {
    resourceLimits = [
        cpus: 2,
        memory: '12.GB',
        time: '1.h'
    ]

    withName: 'EUKCC_SINGLE' {
          ext.args = '--clade fungi --simple'
    }

    withName: 'REGISTERSTUDY|SUBMIT|ENA_WEBIN_CLI_WRAPPER' {
          ext.when = false
    }
}

params {
    config_profile_name        = 'Test --mode mags no_quality profile'
    config_profile_description = 'Single-case eukaryotic MAG test with missing completeness and contamination values'

    // Input data
    input            = params.pipelines_testdata_base_path + 'seqsubmit/samplesheets/mag_no_quality_euk.csv'

    mode             = "mags"
    submission_study = "TEST_STUDY"
    centre_name      = "TEST_CENTER"

    test_upload      = true

    // Using fungi DB only from EukCC
    eukcc_db       = 'https://ftp.ebi.ac.uk/pub/databases/metagenomics/eukcc/eukcc2_db_tiny_fungi_test.tar.gz'

}
