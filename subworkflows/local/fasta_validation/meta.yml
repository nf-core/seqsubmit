# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fasta_validation"
description: |
  Validates input FASTA files and filters out those with fewer than 2 contigs.
  Passes valid files through falint for format checking; emits only well-formed FASTAs.
keywords:
  - fasta
  - validation
  - quality control
  - contigs
components:
  - falint
input:
  - input_fasta:
      type: file
      description: |
        Channel containing FASTA files to validate.
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta,fna,fa.gz,fasta.gz,fna.gz}"
      ontologies:
        - edam: "http://edamontology.org/format_1929" # FASTA
output:
  - valid_fastas:
      type: file
      description: |
        Channel containing FASTA files that passed both the contig-count filter
        and falint format validation.
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta,fna,fa.gz,fasta.gz,fna.gz}"
      ontologies:
        - edam: "http://edamontology.org/format_1929" # FASTA
authors:
  - "@KateSakharova"
  - "@ochkalova"
